<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Countdown to No Nut November.">
  <title>NNN — Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --text: #f2f2f2;
      --muted: #858585;
      --accent: #e64b57;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, 100%);
      text-align: center;
    }
    .year {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 750;
      letter-spacing: -.055em;
      line-height: 1.05;
    }
    .phase {
      margin: 32px 0 -22px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 3vw, 28px);
      margin: clamp(38px, 8vw, 64px) 0 32px;
      font-variant-numeric: tabular-nums;
    }
    .number {
      display: block;
      font-size: clamp(30px, 7vw, 62px);
      font-weight: 650;
      line-height: 1;
      letter-spacing: -.06em;
    }
    .label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .timestamp {
      margin: 0;
      color: var(--muted);
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 420px) {
      body { padding-inline: 12px; }
      .countdown { gap: 8px; }
      .label { font-size: 10px; }
      .timestamp { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="year" id="year">NNN</p>
    <h1>No Nut November</h1>
    <p class="phase" id="phase">Starts in</p>
    <div class="countdown" id="countdown" role="timer" aria-live="off" aria-label="Time until No Nut November">
      <div><span class="number" id="days">000</span><span class="label">Days</span></div>
      <div><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </div>
    <p class="timestamp"><time id="timestamp" datetime="2026-11-01T00:00:00.000Z">2026-11-01 00:00:00 UTC</time></p>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const pad = (value, width = 2) => String(value).padStart(width, "0");

      function getEvent(now) {
        const date = new Date(now);
        const year = date.getUTCFullYear();
        const start = Date.UTC(year, 10, 1, 0, 0, 0);
        const end = Date.UTC(year, 11, 1, 0, 0, 0);

        if (now < start) {
          return { year, target: start, phase: "Starts in" };
        }
        if (now < end) {
          return { year, target: end, phase: "Ends in" };
        }
        return {
          year: year + 1,
          target: Date.UTC(year + 1, 10, 1, 0, 0, 0),
          phase: "Starts in"
        };
      }

      function tick() {
        const now = Date.now();
        const event = getEvent(now);
        const secondsLeft = Math.max(0, Math.floor((event.target - now) / 1000));
        const days = Math.floor(secondsLeft / 86400);
        const hours = Math.floor((secondsLeft % 86400) / 3600);
        const minutes = Math.floor((secondsLeft % 3600) / 60);
        const seconds = secondsLeft % 60;

        $("year").textContent = `NNN · ${event.year}`;
        $("phase").textContent = event.phase;
        $("days").textContent = pad(days, 3);
        $("hours").textContent = pad(hours);
        $("minutes").textContent = pad(minutes);
        $("seconds").textContent = pad(seconds);

        const targetDate = new Date(event.target);
        const formattedTarget =
          `${targetDate.getUTCFullYear()}-${pad(targetDate.getUTCMonth() + 1)}-${pad(targetDate.getUTCDate())} 00:00:00 UTC`;
        $("timestamp").dateTime = targetDate.toISOString();
        $("timestamp").textContent = formattedTarget;
        $("countdown").setAttribute(
          "aria-label",
          `${event.phase} No Nut November ${event.year}, target ${formattedTarget}`
        );
        document.title = `NNN ${event.year} — ${event.phase}`;
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
