<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Countdown to No Nut November 2026.">
  <title>NNN 2026 — Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --text: #f2f2f2;
      --muted: #858585;
      --accent: #e64b57;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, 100%);
      text-align: center;
    }
    .year {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 750;
      letter-spacing: -.055em;
      line-height: 1.05;
    }
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 3vw, 28px);
      margin: clamp(38px, 8vw, 64px) 0 32px;
      font-variant-numeric: tabular-nums;
    }
    .number {
      display: block;
      font-size: clamp(30px, 7vw, 62px);
      font-weight: 650;
      line-height: 1;
      letter-spacing: -.06em;
    }
    .label {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .timestamp {
      margin: 0;
      color: var(--muted);
      font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (max-width: 420px) {
      body { padding-inline: 12px; }
      .countdown { gap: 8px; }
      .label { font-size: 10px; }
      .timestamp { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="year">NNN · 2026</p>
    <h1>No Nut November</h1>
    <div class="countdown" role="timer" aria-live="off" aria-label="Time until November 1, 2026 at 00:00 UTC">
      <div><span class="number" id="days">000</span><span class="label">Days</span></div>
      <div><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </div>
    <p class="timestamp" id="timestamp"><time datetime="2026-11-01T00:00:00Z">2026-11-01 00:00:00 UTC</time></p>
  </main>
  <script>
    (() => {
      // One fixed instant for everyone: November 1, 2026 at 00:00 UTC.
      const start = Date.UTC(2026, 10, 1, 0, 0, 0);
      const $ = (id) => document.getElementById(id);
      const pad = (value, width = 2) => String(value).padStart(width, "0");

      function tick() {
        const remaining = Math.floor((start - Date.now()) / 1000);
        const total = Math.abs(remaining);
        $("days").textContent = pad(Math.floor(total / 86400), 3);
        $("hours").textContent = pad(Math.floor((total % 86400) / 3600));
        $("minutes").textContent = pad(Math.floor((total % 3600) / 60));
        $("seconds").textContent = pad(total % 60);

        const mode = remaining >= 0 ? "Countdown" : "Elapsed";
        document.title = `${pad(Math.floor(total / 86400), 3)}d ${pad(Math.floor((total % 86400) / 3600))}h — NNN 2026 ${mode}`;
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
